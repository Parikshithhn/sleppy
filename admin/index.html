<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Sleppy Esports Admin</title>
<style>
body{margin:0;background:#090a0d;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}
h1{margin-bottom:6px}.sub{color:#999}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:25px 0}
.card{background:#14161b;border:1px solid #282c34;border-radius:12px;padding:18px}.num{font-size:30px;font-weight:700;margin-top:8px}
button{background:#e22d47;color:white;border:0;padding:11px 15px;border-radius:8px;cursor:pointer}input{background:#111318;border:1px solid #30343c;color:#fff;padding:10px;border-radius:7px;width:260px}
pre{white-space:pre-wrap;background:#111318;padding:15px;border-radius:10px;overflow:auto}
</style></head><body><div class="wrap">
<h1>SLEPPY ESPORTS</h1><div class="sub">WhatsApp Team Management Admin</div>
<p><input id="key" placeholder="Admin API key"><button onclick="load()">LOAD DASHBOARD</button></p>
<div class="grid" id="cards"></div><h2>Recent Audit Logs</h2><pre id="logs">Enter your admin API key.</pre>
<script>
async function load(){
 const key=document.getElementById('key').value;
 const h={'x-admin-key':key};
 const d=await fetch('/api/admin/dashboard',{headers:h}).then(r=>r.json());
 document.getElementById('cards').innerHTML=Object.entries(d).map(([k,v])=>`<div class="card">${k}<div class="num">${v}</div></div>`).join('');
 const l=await fetch('/api/admin/logs',{headers:h}).then(r=>r.json());
 document.getElementById('logs').textContent=JSON.stringify(l.slice(0,30),null,2);
}
</script></div></body></html>
